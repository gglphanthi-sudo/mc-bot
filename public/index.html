<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KingMC Bot Panel</title>
    <style>
        
{ box-sizing: border-box; }
      body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }.container { max-width: 850px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
      h2 { margin-top: 0; text-align: center; color: #00ff88; }.status-bar { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 12px 20px; border-radius: 6px; margin-bottom: 15px; }.btn { padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-left: 5px; }.btn-start { background: #28a745; color: white; }.btn-stop { background: #dc3545; color: white; }#log-box { background: #000; color: #00ff88; font-family: 'Consolas', monospace; height: 380px; overflow-y: auto; padding: 12px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; line-height: 1.4; white-space: pre-wrap; word-break: break-all; }
      /* Khung Chat ở phía dưới */.chat-container { display: flex; gap: 10px; }.chat-input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #2b2b2b; color: #fff; outline: none; font-size: 14px; }.chat-input:focus { border-color: #00ff88; }.chat-btn { padding: 12px 24px; background: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }.chat-btn:hover { background: #0056b3; }</style>
</head>
<body>
    <div class="container">
        <h2>KingMC Bot Control Panel</h2>

        <div class="status-bar">
            <div>Trạng thái: <span id="status-text" style="color: #ff4444; font-weight: bold;">OFFLINE</span></div>
            <div>
                <button class="btn btn-start" onclick="startBot()">Bật Bot</button>
                <button class="btn btn-stop" onclick="stopBot()">Tắt Bot</button>
            </div>
        </div>

        <!-- Khung xem nhật ký / console -->
        <div id="log-box"></div>

        <!-- Ô nhập câu chat / lệnh dưới cùng -->
        <div class="chat-container">
            <input type="text" id="chat-input" class="chat-input" placeholder="Nhập câu chat hoặc lệnh (VD: /afk, hello, /menu...)" onkeypress="handleKeyPress(event)">
            <button class="chat-btn" onclick="sendChat()">Gửi</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const logBox = document.getElementById('log-box');
        const statusText = document.getElementById('status-text');
        const chatInput = document.getElementById('chat-input');

        socket.on('log', (msg) => {
            const div = document.createElement('div');
            div.textContent = msg;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        });

        socket.on('status', (data) => {
            statusText.textContent = data.status;
            statusText.style.color = data.color;
        });

        function startBot() {
            socket.emit('start_farm');
        }

        function stopBot() {
            socket.emit('stop_farm');
        }

        function sendChat() {
            const msg = chatInput.value.trim();
            if (msg) {
                socket.emit('send_chat', msg);
                chatInput.value = '';
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendChat();
            }
        }
    </script>
</body>
</html>
