<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cat Tool — Owner Panel</title>
    <!-- CSS giữ nguyên phong cách cũ của bạn -->
    <style>
        /* [Giữ nguyên toàn bộ CSS cũ của bạn] */
        #maintenanceOverlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.98); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; }
        #maintenanceOverlay.active { display: flex; }
    </style>
</head>
<body>

<div id="maintenanceOverlay">
    <h1>🔧 BẢO TRÌ</h1>
    <p>Hệ thống đang được <strong style="color:#ff3300;">owner</strong> nâng cấp.<br>Vui lòng quay lại sau!</p>
</div>

<!-- Nội dung trang web bình thường -->
<div class="container">
    <h2>Cat Tool Panel</h2>
    <div class="subtitle">Hệ thống AFK Bot chuyên nghiệp</div>
    
    <!-- Các phần khác... -->

    <div id="adminPanel" class="admin-panel">
        <h3 class="vintage-title">🔐 BẢNG ĐIỀU KHIỂN QUẢN TRỊ</h3>
        <p class="text-center vintage-sub">Chỉ dành cho owner</p>
        
        <div class="admin-login-box">
            <input type="password" id="adminPass" placeholder="Nhập mật khẩu owner...">
            <button onclick="adminLogin()">🔓 Mở Khóa</button>
        </div>

        <div id="adminContent" style="display: none;">
            <div class="text-center mt-10">
                <button id="maintenanceBtn" class="maintenance-toggle" onclick="toggleMaintenance()">
                    🛠️ Bật/Tắt Bảo Trì
                </button>
            </div>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const ADMIN_PASSWORD = 'tuihoibideptrai'; 
    let currentMaintenance = false;

    // Lắng nghe trạng thái bảo trì từ Server
    socket.on('maintenance_status', (status) => {
        currentMaintenance = status;
        const overlay = document.getElementById('maintenanceOverlay');
        status ? overlay.classList.add('active') : overlay.classList.remove('active');
    });

    // Hàm gọi lên server
    function toggleMaintenance() {
        // Gửi lệnh ngược với trạng thái hiện tại
        socket.emit('toggle_maintenance', !currentMaintenance);
    }

    // Các hàm khác như login...
    function adminLogin() {
        const pass = document.getElementById('adminPass').value;
        if (pass === ADMIN_PASSWORD) {
            document.getElementById('adminContent').style.display = 'block';
        } else {
            alert('Sai mật khẩu!');
        }
    }
</script>
</body>
</html>
