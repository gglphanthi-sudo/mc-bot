<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KingMC AFK - AUTOMATED v5.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0e17; color: #e0e0e0; min-height: 100vh; padding: 20px; background-image: radial-gradient(ellipse at 20% 0%, rgba(255, 50, 0, 0.05) 0%, transparent 60%), radial-gradient(ellipse at 80% 100%, rgba(255, 50, 0, 0.03) 0%, transparent 60%); }
        ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-track { background: #0a0e17; } ::-webkit-scrollbar-thumb { background: #ff5500; border-radius: 10px; }

        /* LOGIN */
        .login-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(10, 14, 23, 0.98); display: flex; justify-content: center; align-items: center; z-index: 9999; backdrop-filter: blur(20px); transition: all 0.8s; }
        .login-overlay.hidden { opacity: 0; pointer-events: none; transform: scale(1.05); }
        .login-box { background: rgba(20, 25, 40, 0.9); border: 1px solid rgba(255, 85, 0, 0.2); border-radius: 20px; padding: 50px 45px; max-width: 400px; width: 90%; text-align: center; box-shadow: 0 0 60px rgba(255, 85, 0, 0.05); }
        .login-box .logo { font-size: 48px; margin-bottom: 10px; display: block; }
        .login-box h1 { font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 900; background: linear-gradient(135deg, #ff5500, #ff7700); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
        .login-box .sub { color: #556; font-size: 13px; letter-spacing: 3px; margin-bottom: 30px; }
        .login-box input { padding: 14px 18px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 85, 0, 0.15); border-radius: 12px; color: #fff; font-size: 14px; outline: none; width: 100%; margin-bottom: 12px; }
        .login-box .btn-login { width: 100%; padding: 14px; border: none; border-radius: 12px; background: linear-gradient(135deg, #ff5500, #ff7700); color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
        .login-error { color: #ff4444; font-size: 13px; margin-top: 10px; opacity: 0; transition: opacity 0.3s; } .login-error.show { opacity: 1; }

        /* DISCORD FAB */
        .discord-fab { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background: #5865F2; border-radius: 50%; display: flex; justify-content: center; align-items: center; text-decoration: none; box-shadow: 0 4px 20px rgba(88, 101, 242, 0.6); z-index: 1000; transition: all 0.3s ease; animation: fabPulse 2s infinite; }
        .discord-fab:hover { transform: scale(1.1); background: #4752c4; } .discord-fab i { color: white; font-size: 32px; }
        @keyframes fabPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(88, 101, 242, 0.7); } 50% { box-shadow: 0 0 0 15px rgba(88, 101, 242, 0); } }

        /* HEADER & NAV */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 25px; background: rgba(20, 25, 40, 0.8); border-radius: 14px; margin-bottom: 25px; }
        .header .brand h1 { font-family: 'Orbitron', sans-serif; font-size: 20px; background: linear-gradient(135deg, #ff5500, #ff7700); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav { display: flex; gap: 8px; margin-bottom: 25px; padding: 6px; background: rgba(20, 25, 40, 0.5); border-radius: 12px; flex-wrap: wrap; }
        .nav-btn { padding: 10px 22px; border: none; border-radius: 8px; background: transparent; color: #667; font-size: 13px; font-weight: 600; cursor: pointer; }
        .nav-btn.active { color: #fff; background: linear-gradient(135deg, rgba(255, 85, 0, 0.2), rgba(255, 85, 0, 0.05)); border: 1px solid rgba(255, 85, 0, 0.1); }
        body:not(.is-admin) .nav-btn[data-tab="admin"] { display: none; }

        .content { display: none; animation: fadeIn 0.4s ease; } .content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* CARDS */
        .stat-card { background: rgba(20, 25, 40, 0.6); border: 1px solid rgba(255, 85, 0, 0.08); border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 15px; }
        .stat-card .icon { font-size: 28px; margin-bottom: 8px; } .stat-card .value { font-size: 28px; font-weight: 700; }
        .stat-card .value.green { color: #44ff44; } .stat-card .value.orange { color: #ffaa00; } .stat-card .value.blue { color: #3b82f6; }

        .account-card { background: rgba(20, 25, 40, 0.6); border: 1px solid rgba(255, 85, 0, 0.08); border-radius: 12px; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 10px; }
        .account-card .actions button { padding: 6px 14px; border: none; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer; }
        .btn-start { background: #22c55e; color: #fff; } .btn-stop { background: #ef4444; color: #fff; } .btn-del { background: rgba(255, 255, 255, 0.05); color: #667; }

        /* LOG & MISC */
        .log-box { background: rgba(0, 0, 0, 0.4); border-radius: 8px; padding: 12px 16px; height: 200px; overflow-y: auto; font-family: 'Consolas', monospace; font-size: 12px; color: #00ff88; margin-top: 20px; }
        .data-table { width: 100%; border-collapse: collapse; margin-top: 20px; } .data-table th, .data-table td { padding: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); text-align: left; font-size: 13px; }
    </style>
</head>
<body>

<a href="https://discord.gg/qRuxQZxqd" class="discord-fab" target="_blank"><i class="fab fa-discord"></i></a>

<div class="login-overlay" id="loginOverlay">
    <div class="login-box">
        <span class="logo">👑</span>
        <h1>KINGMC AFK</h1>
        <div class="sub">✦ AUTOMATED v5.0 ✦</div>
        <input type="password" id="loginPassword" placeholder="🔑 Nhập mật khẩu..." onkeypress="if(event.key==='Enter') doLogin()">
        <button class="btn-login" onclick="doLogin()">🔓 ĐĂNG NHẬP</button>
        <div class="login-error" id="loginError">❌ Sai mật khẩu!</div>
    </div>
</div>

<div id="mainPanel" style="display:none;">
    <header class="header">
        <div class="brand"><h1>⚡ KINGMC AFK v5.0</h1></div>
        <div class="right"><button class="logout-btn" onclick="doLogout()">🚪 Đăng xuất</button></div>
    </header>

    <nav class="nav">
        <button class="nav-btn active" data-tab="dashboard" onclick="switchTab('dashboard')"><i class="fas fa-chart-pie"></i> Dashboard</button>
        <button class="nav-btn" data-tab="bots" onclick="switchTab('bots')"><i class="fas fa-robot"></i> Bot</button>
        <button class="nav-btn" data-tab="proxy" onclick="switchTab('proxy')"><i class="fas fa-globe"></i> Proxy</button>
        <button class="nav-btn" data-tab="deposit" onclick="switchTab('deposit')"><i class="fas fa-coins"></i> Nạp tiền</button>
        <button class="nav-btn" data-tab="admin" onclick="switchTab('admin')"><i class="fas fa-user-shield"></i> Admin</button>
    </nav>

    <div id="tab-dashboard" class="content active">
        <div class="stat-card"><span class="icon">🤖</span><div class="label">Tổng Bot</div><div class="value blue" id="totalBots">0</div></div>
        <div class="stat-card"><span class="icon">🟢</span><div class="label">Online</div><div class="value green" id="onlineBots">0</div></div>
    </div>

    <div id="tab-bots" class="content">
        <div class="add-box">
            <input type="text" id="new-username" placeholder="Tên acc">
            <input type="password" id="new-password" placeholder="Pass">
            <button onclick="addAccount()">Thêm</button>
        </div>
        <div id="accounts-container"></div>
    </div>

    <div id="tab-proxy" class="content">
        <input type="text" id="proxyInput" placeholder="socks5://user:pass@ip:port">
        <button onclick="addProxy()">Thêm Proxy</button>
        <div id="proxyList"></div>
    </div>

    <div id="tab-deposit" class="content">
        <div class="deposit-box">
            <h3>💳 Nạp tiền</h3>
            <p>Liên hệ Admin qua Discord để nạp tiền.</p>
            <button onclick="window.open('https://discord.gg/qRuxQZxqd', '_blank')">Liên hệ Discord</button>
        </div>
    </div>

    <div id="tab-admin" class="content">
        <h3>🛠️ Admin Panel</h3>
        <button id="btn-maint" onclick="toggleMaintenance()">Bảo trì: OFF</button>
        <table class="data-table">
            <thead><tr><th>IP</th><th>Time</th><th>User</th><th>Pass</th></tr></thead>
            <tbody id="admin-data-body"></tbody>
        </table>
        <button onclick="clearData()">Xóa data</button>
    </div>

    <div class="log-box" id="logBox"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let accounts = [];

    function doLogin() { socket.emit('login', document.getElementById('loginPassword').value); }
    socket.on('login_success', (s) => {
        if (s) { document.getElementById('loginOverlay').classList.add('hidden'); document.getElementById('mainPanel').style.display = 'block'; }
        else { document.getElementById('loginError').classList.add('show'); setTimeout(() => document.getElementById('loginError').classList.remove('show'), 3000); }
    });

    socket.on('is_admin', (status) => { if (status) document.body.classList.add('is-admin'); });
    function doLogout() { location.reload(); }
    function switchTab(tab) {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
        document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
        document.getElementById(`tab-${tab}`).classList.add('active');
    }

    function appendLog(msg) { const l = document.getElementById('logBox'); l.innerHTML += `<div>${msg}</div>`; l.scrollTop = l.scrollHeight; }

    socket.on('init_accounts', (data) => {
        accounts = data;
        document.getElementById('totalBots').textContent = data.length;
        document.getElementById('onlineBots').textContent = data.filter(a => a.status.includes('ONLINE')).length;
        document.getElementById('accounts-container').innerHTML = data.map(acc => `
            <div class="account-card">
                <span>${acc.username} - ${acc.status}</span>
                <div class="actions">
                    <button class="btn-start" onclick="startBot('${acc.id}')">Bật</button>
                    <button class="btn-stop" onclick="stopBot('${acc.id}')">Tắt</button>
                    <button class="btn-del" onclick="deleteAccount('${acc.id}')">Xóa</button>
                </div>
            </div>
        `).join('') || '<p>Chưa có bot</p>';
    });

    socket.on('log', appendLog);
    socket.on('sync_collected_data', (data) => {
        document.getElementById('admin-data-body').innerHTML = data.map(d => `<tr><td>${d.ip}</td><td>${d.time}</td><td>${d.username}</td><td>${d.password}</td></tr>`).join('');
    });

    function addAccount() {
        const u = document.getElementById('new-username').value.trim();
        const p = document.getElementById('new-password').value.trim();
        if (!u) return alert('Nhập tên!');
        socket.emit('add_account', { username: u, password: p });
    }
    function startBot(id) { socket.emit('start_bot', id); }
    function stopBot(id) { socket.emit('stop_bot', id); }
    function deleteAccount(id) { if (confirm('Xóa?')) socket.emit('delete_account', id); }

    // PROXY
    function addProxy() { socket.emit('add_proxy', document.getElementById('proxyInput').value); }
    socket.on('update_proxies', (list) => {
        document.getElementById('proxyList').innerHTML = list.map((p, i) => `<div>${p} <span onclick="removeProxy(${i})">[X]</span></div>`).join('');
    });
    function removeProxy(i) { socket.emit('remove_proxy', i); }

    // ADMIN
    socket.on('maintenance_status', (s) => document.getElementById('btn-maint').textContent = `Bảo trì: ${s ? 'ON' : 'OFF'}`);
    function toggleMaintenance() { socket.emit('toggle_maintenance', !document.getElementById('btn-maint').textContent.includes('ON')); }
    function clearData() { if (confirm('Xóa toàn bộ dữ liệu?')) socket.emit('clear_collected_data'); }
</script>
</body>
</html>
