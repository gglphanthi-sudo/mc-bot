<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Bot Minecraft</title>
    <style>
        body {
            background-color: #120902;
            color: #fff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(20, 10, 3, 0.95);
            border: 1px solid #662b00;
            padding: 20px;
            border-radius: 10px;
        }
        .add-account-box, .control-box {
            background: rgba(30, 15, 5, 0.9);
            border: 1px solid #662b00;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        input, select {
            padding: 10px;
            background: rgba(10, 5, 2, 0.9);
            border: 1px solid #662b00;
            border-radius: 6px;
            color: #fff;
            outline: none;
            font-size: 14px;
        }
        input { flex: 1; }
        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-add { background: #ffaa66; color: #1a0800; }
    </style>
</head>
<body>

<div class="container">
    <h2>🛠️ Bảng Điều Khiển Bot Minecraft</h2>

    <!-- ===== 1. THÊM TÀI KHOẢN ===== -->
    <div class="add-account-box">
        <input type="text" id="new-username" placeholder="Nhập tên tài khoản Minecraft...">
        <input type="password" id="new-password" placeholder="Mật khẩu (mặc định: caigicungdc)">
        <button class="btn btn-add" onclick="addAccount()">+ Thêm Bot</button>
    </div>

    <!-- ===== 2. CHỌN BOT ĐIỀU KHIỂN NHANH ===== -->
    <div class="add-account-box">
        <span style="color: #ffaa66; font-weight: bold; font-size: 13px;">🤖 Chọn Bot:</span>
        <select id="quickBotSelect" style="flex: 1;">
            <option value="">-- Chưa có bot nào --</option>
        </select>
        <button class="btn" style="background: #ff7700; color: #1a0800;" onclick="quickStartSelectedBot()">▶ Bật</button>
        <button class="btn" style="background: #ff3333; color: white;" onclick="quickStopSelectedBot()">⏹ Tắt</button>
    </div>

    <!-- ===== 3. ĐIỀU KHIỂN BẢO TRÌ HỆ THỐNG ===== -->
    <div class="control-box">
        <span id="maintenanceStatusLabel" style="color: #fff; font-size: 14px; flex: 1;">Trạng thái Bảo trì: <strong style="color: #28a745;">Hoạt động bình thường 🟢</strong></span>
        <button id="btnToggleMaintenance" class="btn" style="background: #ff3333; color: #fff;" onclick="toggleMaintenanceMode()">🔒 Bật Bảo Trì</button>
    </div>
</div>

<script>
    // Dữ liệu mẫu danh sách tài khoản bot
    let accounts = [
        { id: '1', username: 'Bot_Test_01', status: 'Offline' }
    ];

    // Khởi tạo giao diện ban đầu
    function initUI() {
        renderAccounts();
    }

    // Cập nhật lại thẻ Select danh sách bot
    function renderAccounts() {
        const quickSelect = document.getElementById('quickBotSelect');
        if (quickSelect) {
            quickSelect.innerHTML = '';
            if (!accounts || accounts.length === 0) {
                quickSelect.innerHTML = '<option value="">-- Chưa có bot nào --</option>';
            } else {
                accounts.forEach(acc => {
                    const opt = document.createElement('option');
                    opt.value = acc.id;
                    opt.textContent = `${acc.username} (${acc.status})`;
                    quickSelect.appendChild(opt);
                });
            }
        }
    }

    // Thêm bot mới
    function addAccount() {
        const usernameInput = document.getElementById('new-username');
        const username = usernameInput.value.trim();
        if (!username) {
            alert('Vui lòng nhập tên tài khoản!');
            return;
        }
        
        accounts.push({
            id: Date.now().toString(),
            username: username,
            status: 'Offline'
        });
        
        usernameInput.value = '';
        renderAccounts();
        alert('Đã thêm bot thành công!');
    }

    // Thao tác Bật/Tắt Bot
    function startBot(id) {
        const bot = accounts.find(acc => acc.id === id);
        if (bot) {
            bot.status = 'Online';
            renderAccounts();
            alert(`Đã bật bot: ${bot.username}`);
        }
    }

    function stopBot(id) {
        const bot = accounts.find(acc => acc.id === id);
        if (bot) {
            bot.status = 'Offline';
            renderAccounts();
            alert(`Đã tắt bot: ${bot.username}`);
        }
    }

    function quickStartSelectedBot() {
        const select = document.getElementById('quickBotSelect');
        if (select.value) {
            startBot(select.value);
        } else {
            alert('Vui lòng chọn một bot!');
        }
    }

    function quickStopSelectedBot() {
        const select = document.getElementById('quickBotSelect');
        if (select.value) {
            stopBot(select.value);
        } else {
            alert('Vui lòng chọn một bot!');
        }
    }

    // Xử lý Chế độ Bảo trì
    let isMaintenanceOn = false;

    function toggleMaintenanceMode() {
        isMaintenanceOn = !isMaintenanceOn;
        const label = document.getElementById('maintenanceStatusLabel');
        const btn = document.getElementById('btnToggleMaintenance');
        
        if (isMaintenanceOn) {
            label.innerHTML = 'Trạng thái Bảo trì: <strong style="color: #ff3333;">Đang BẢO TRÌ 🔴</strong>';
            btn.textContent = '🔓 Tắt Bảo Trì';
            btn.style.background = '#28a745';
        } else {
            label.innerHTML = 'Trạng thái Bảo trì: <strong style="color: #28a745;">Hoạt động bình thường 🟢</strong>';
            btn.textContent = '🔒 Bật Bảo Trì';
            btn.style.background = '#ff3333';
        }
    }

    // Chạy khởi tạo khi tải trang
    window.onload = initUI;
</script>

</body>
</html>
