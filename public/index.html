<!DOCTYPE html>
<html>
<head>
    <title>MC Bot Control</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; }
        .box { width: 350px; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        input { width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 4px; border: none; }
        button { width: 48%; padding: 10px; cursor: pointer; }
        #logs { background: #000; height: 200px; overflow-y: auto; margin-top: 10px; font-size: 12px; padding: 5px; color: #0f0; }
    </style>
</head>
<body>
    <div class="box">
        <h3>Điều khiển Bot</h3>
        <input id="user" placeholder="Tên Bot">
        <input id="pass" type="password" placeholder="Mật khẩu (/dn ...)">
        <button onclick="emit('startBot')">BẬT</button>
        <button onclick="emit('stopBot')">TẮT</button>
        <div id="logs"></div>
    </div>

    <script>
        const socket = io();
        function emit(type) {
            socket.emit(type, { username: document.getElementById('user').value, password: document.getElementById('pass').value });
        }
        socket.on('log', (data) => {
            const logs = document.getElementById('logs');
            logs.innerHTML += `<div>> ${data.msg}</div>`;
            logs.scrollTop = logs.scrollHeight;
        });
    </script>
</body>
</html>
